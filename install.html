<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케어링 ERP 설치</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 16px; padding: 48px 52px; width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
  .logo { font-size: 28px; font-weight: 900; letter-spacing: 4px; color: #F36178; margin-bottom: 6px; }
  .logo-sub { font-size: 11px; color: #bbb; letter-spacing: 0.5px; margin-bottom: 32px; }
  h1 { font-size: 18px; font-weight: 700; color: #222; margin-bottom: 10px; }
  p { font-size: 13px; color: #888; line-height: 1.8; margin-bottom: 32px; }
  .btn { display: inline-block; background: #F36178; color: #fff; font-size: 15px; font-weight: 700; padding: 14px 36px; border-radius: 10px; text-decoration: none; margin-bottom: 16px; width: 100%; }
  .btn:hover { background: #e04f65; }
  .guide { background: #f8f8f8; border-radius: 10px; padding: 18px 20px; text-align: left; margin-top: 24px; }
  .guide-title { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 10px; }
  .step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; font-size: 12px; color: #666; line-height: 1.6; }
  .num { background: #F36178; color: #fff; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
  .note { font-size: 11px; color: #bbb; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">CHIZ</div>
  <div class="logo-sub">Caring HR Intelligence Zone</div>
  <h1>개발환경 설치</h1>
  <p>아래 버튼을 클릭해 설치 파일을 다운받고<br>우클릭 → 관리자 권한으로 실행해주세요.</p>

  <a class="btn" href="setup.bat" download="케어링_설치.bat">⬇ 설치 파일 다운로드</a>

  <div class="guide">
    <div class="guide-title">설치 순서</div>
    <div class="step"><span class="num">1</span><span>다운받은 <strong>케어링_설치.bat</strong> 파일 우클릭</span></div>
    <div class="step"><span class="num">2</span><span><strong>관리자 권한으로 실행</strong> 클릭</span></div>
    <div class="step"><span class="num">3</span><span>설치 완료되면 바탕화면에 <strong>케어링_실행.bat</strong> 생성됨</span></div>
    <div class="step"><span class="num">4</span><span>케어링_실행.bat 더블클릭 → Claude 로그인 → 작업 시작</span></div>
  </div>

  <p class="note">문의: db.yu@caring.co.kr</p>
</div>
</body>
</html>
